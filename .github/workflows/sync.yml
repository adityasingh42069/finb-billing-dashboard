name: Sync fetch logs

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *" # 07:00 IST daily

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FETCH_LOGS_BASE_URL: ${{ secrets.FETCH_LOGS_BASE_URL }}
      CHANNEL_USER_ID: ${{ secrets.CHANNEL_USER_ID }}
      CHANNEL_PASSWORD: ${{ secrets.CHANNEL_PASSWORD }}
    steps:
      - name: Skip until secrets are configured
        id: guard
        run: |
          if [ -n "$FETCH_LOGS_BASE_URL" ] && [ -n "$CHANNEL_USER_ID" ] && [ -n "$CHANNEL_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Secrets not set; nothing to do."
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Build data.json
        if: steps.guard.outputs.ready == 'true'
        run: node scripts/sync.mjs
      - name: Commit if changed
        if: steps.guard.outputs.ready == 'true'
        run: |
          git add data.json
          if git diff --cached --quiet -- data.json; then
            echo "No change."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync fetch logs"
            git push
          fi
